spring.application.name=genstory
# DB config for deployment on server
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:genstory}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jackson.property-naming-strategy=SNAKE_CASE

#api genmini
spring.ai.openai.api-key=${GENMINI_KEY}
spring.ai.openai.chat.base-url= https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=gemini-2.0-flash

#AIzaSyA1DuHUsg2nYOD3pbvGLr_-YWc8QXiYa1g
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.servlet.context-path=/genstory

